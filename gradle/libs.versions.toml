[versions]
agp = "9.2.1"
kotlin = "2.1.0"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activityCompose = "1.9.3"
constraintlayout = "2.2.0"

# Compose
composeBom = "2024.12.01"

# AndroidX Lifecycle
lifecycle = "2.8.7"

# Coroutines
coroutines = "1.10.1"

# Media3
media3 = "1.6.0"

# DataStore
datastore = "1.1.1"

# Navigation
navigationCompose = "2.8.5"

# Coil
coil = "2.7.0"

# IjkPlayer:k0.8.8 是最后一个上游 release。maven.bilibili.com 这两年访问极不稳定/部分
# artifact 已下线,新接入时建议:
#   1) 从 https://github.com/bilibili/ijkplayer release 拉对应 aar 放到 :media/libs/
#   2) 或使用社区维护的 jitpack mirror,把 settings.gradle.kts 里换成
#      `maven { url = uri("https://jitpack.io") }` 并改 groupId
ijkplayer = "0.8.8"

# CameraX —— 录制功能用
cameraX = "1.4.1"

# MediaPipe Tasks Vision —— 手势识别(HandLandmarker / GestureRecognizer)
# 模型文件 hand_landmarker.task / gesture_recognizer.task 需手动放到 app/src/main/assets/,
# 否则分析器会 no-op 并打 warn(分析帧仍会消费,UI 不会崩)。
# 从 https://developers.google.com/mediapipe/solutions/vision/gesture_recognizer 下载。
mediapipeTasksVision = "0.10.21"

[libraries]
# Core AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Media3
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
# datasource + database 用于 progressive HTTP 流播的边下边播缓存
# (SimpleCache + CacheDataSource + StandaloneDatabaseProvider)
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
# media3-session 提供 MediaSessionService / MediaSession,后台音频通知栏控制走它
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }

# IjkPlayer artifact 坐标(maven.bilibili.com 上 0.8.8 部分已下线,接入时改成本地 files
# 或换成可用的 jitpack mirror 即可)。alias 留在这里是给将来 implementation(libs.ijkplayer.*) 用,
# 现在 :media 的 build.gradle.kts 已经把对应 implementation 行注释掉了。
# ijkplayer-java = { group = "tv.danmaku.ijk.media", name = "ijkplayer-java", version.ref = "ijkplayer" }
# ijkplayer-arm64 = { group = "tv.danmaku.ijk.media", name = "ijkplayer-arm64", version.ref = "ijkplayer" }
# ijkplayer-armv7a = { group = "tv.danmaku.ijk.media", name = "ijkplayer-armv7a", version.ref = "ijkplayer" }

# CameraX:录像走 video + view (PreviewView) + lifecycle (绑定 Activity 生命周期)
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }

# MediaPipe Tasks Vision —— 手势识别(GestureRecognizer 内部包含 HandLandmarker)
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasksVision" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Note: AGP 9.x has built-in Kotlin support — do NOT apply org.jetbrains.kotlin.android,
# it will conflict with the auto-registered `kotlin` extension. The `kotlin` version above
# is still used by the compose compiler plugin.
